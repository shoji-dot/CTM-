{% extends "base.html" %}
{% block title %}出荷登録{% endblock %}
{% block content %}
<div style="padding:20px 24px;max-width:900px">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
    <a href="/shipments" style="color:#5f6b7a;text-decoration:none">← 出荷一覧</a>
    <h1 style="font-size:1.3rem;font-weight:700;margin:0">📦 出荷登録</h1>
  </div>

  {% if error %}
  <div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:12px 16px;margin-bottom:16px;color:#991b1b">⚠ {{ error }}</div>
  {% endif %}

  <form method="post" action="/shipments/new" onsubmit="return prepareSubmit()">

    <!-- ヘッダー -->
    <div style="background:white;border:1px solid #dde3ea;border-radius:12px;padding:20px;margin-bottom:16px">
      <h2 style="font-size:1rem;font-weight:700;margin:0 0 16px">出荷ヘッダー</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div>
          <label style="font-size:0.78rem;font-weight:600;color:#5f6b7a;display:block;margin-bottom:4px">取引先 <span style="color:#e53935">*</span></label>
          <div class="cac-wrap" style="position:relative">
            <input type="text" id="customer_id_text" placeholder="顧客名で検索..." autocomplete="off"
                   style="width:100%;padding:8px 10px;border:1.5px solid #dde3ea;border-radius:8px;font-size:0.88rem;box-sizing:border-box"
                   oninput="customerAC(this,'customer_id','customer_id_dd')"
                   onfocus="if(this.value.trim())customerAC(this,'customer_id','customer_id_dd')">
            <input type="hidden" name="customer_id" id="customer_id" value="">
            <div id="customer_id_dd" class="cac-dd" style="display:none;position:absolute;z-index:9999;background:white;border:1px solid #dde3ea;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);width:100%;max-height:240px;overflow-y:auto"></div>
          </div>
        </div>
        <div>
          <label style="font-size:0.78rem;font-weight:600;color:#5f6b7a;display:block;margin-bottom:4px">エンドユーザー</label>
          <div class="cac-wrap" style="position:relative">
            <input type="text" id="end_user_id_text" placeholder="エンドユーザー名で検索（任意）" autocomplete="off"
                   style="width:100%;padding:8px 10px;border:1.5px solid #dde3ea;border-radius:8px;font-size:0.88rem;box-sizing:border-box"
                   oninput="customerAC(this,'end_user_id','end_user_id_dd')"
                   onfocus="if(this.value.trim())customerAC(this,'end_user_id','end_user_id_dd')">
            <input type="hidden" name="end_user_id" id="end_user_id" value="">
            <div id="end_user_id_dd" class="cac-dd" style="display:none;position:absolute;z-index:9999;background:white;border:1px solid #dde3ea;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);width:100%;max-height:240px;overflow-y:auto"></div>
          </div>
        </div>
        <div>
          <label style="font-size:0.78rem;font-weight:600;color:#5f6b7a;display:block;margin-bottom:4px">出荷日 <span style="color:#e53935">*</span></label>
          <input type="date" name="shipped_date" value="{{ today }}" required style="width:100%;padding:8px 10px;border:1.5px solid #dde3ea;border-radius:8px;font-size:0.88rem">
        </div>
        <div id="return_due_wrap" style="display:none">
          <label style="font-size:0.78rem;font-weight:600;color:#5f6b7a;display:block;margin-bottom:4px">返却期限</label>
          <input type="date" name="return_due_date" style="width:100%;padding:8px 10px;border:1.5px solid #dde3ea;border-radius:8px;font-size:0.88rem">
        </div>
        <div>
          <label style="font-size:0.78rem;font-weight:600;color:#5f6b7a;display:block;margin-bottom:4px">担当者</label>
          <input type="text" name="staff_name" placeholder="担当者名" style="width:100%;padding:8px 10px;border:1.5px solid #dde3ea;border-radius:8px;font-size:0.88rem">
        </div>
        <div>
          <label style="font-size:0.78rem;font-weight:600;color:#5f6b7a;display:block;margin-bottom:4px">備考</label>
          <input type="text" name="notes" placeholder="備考" style="width:100%;padding:8px 10px;border:1.5px solid #dde3ea;border-radius:8px;font-size:0.88rem">
        </div>
      </div>
    </div>

    <!-- 明細 -->
    <div style="background:white;border:1px solid #dde3ea;border-radius:12px;padding:20px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h2 style="font-size:1rem;font-weight:700;margin:0">明細</h2>
        <div style="display:flex;gap:8px">
          <button type="button" onclick="addRow('sale')"    style="padding:6px 12px;background:#1a73e8;color:white;border:none;border-radius:6px;font-size:0.82rem;cursor:pointer">＋ 販売</button>
          <button type="button" onclick="addRow('sample')"  style="padding:6px 12px;background:#0d9488;color:white;border:none;border-radius:6px;font-size:0.82rem;cursor:pointer">＋ サンプル</button>
          <button type="button" onclick="addRow('demo')"    style="padding:6px 12px;background:#7c3aed;color:white;border:none;border-radius:6px;font-size:0.82rem;cursor:pointer">＋ デモ貸出</button>
          <button type="button" onclick="addRow('repair_sub')" style="padding:6px 12px;background:#b45309;color:white;border:none;border-radius:6px;font-size:0.82rem;cursor:pointer">＋ 修理代替品</button>
        </div>
      </div>

      <table style="width:100%;border-collapse:collapse;font-size:0.85rem" id="items_table">
        <thead>
          <tr style="background:#f8fafc;border-bottom:2px solid #dde3ea">
            <th style="padding:8px;text-align:left;width:90px">種別</th>
            <th style="padding:8px;text-align:left">商品 / S.N / ロット</th>
            <th style="padding:8px;text-align:center;width:70px">数量</th>
            <th style="padding:8px;text-align:left;width:110px">使用期限</th>
            <th style="padding:8px;width:36px"></th>
          </tr>
        </thead>
        <tbody id="items_body">
          <tr id="empty_row">
            <td colspan="5" style="padding:24px;text-align:center;color:#9ca3af">上のボタンで明細を追加してください</td>
          </tr>
        </tbody>
      </table>
    </div>

    <input type="hidden" name="items_json" id="items_json">
    <div style="display:flex;gap:10px">
      <button type="submit" style="padding:10px 24px;background:#1a73e8;color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer">📦 出荷登録</button>
      <a href="/shipments" style="padding:10px 18px;border:1.5px solid #dde3ea;border-radius:8px;color:#5f6b7a;text-decoration:none;font-weight:600">キャンセル</a>
    </div>
  </form>
</div>

<!-- 商品検索ドロップダウン（共通） -->
<div id="search_dropdown" style="display:none;position:absolute;z-index:9999;background:white;border:1px solid #dde3ea;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.12);min-width:360px;max-height:280px;overflow-y:auto"></div>

<style>
.item-row td { padding:6px 8px;border-bottom:1px solid #f0f4f8;vertical-align:top }
.type-badge { display:inline-block;padding:2px 8px;border-radius:999px;font-size:0.75rem;font-weight:700 }
.type-sale      { background:#e3f2fd;color:#1565c0 }
.type-sample    { background:#e0f2f1;color:#00695c }
.type-demo      { background:#ede9fe;color:#5b21b6 }
.type-repair_sub{ background:#fef3c7;color:#92400e }
input.item-input { padding:5px 8px;border:1.5px solid #dde3ea;border-radius:6px;font-size:0.83rem;width:100% }
</style>

<script>
const TYPE_LABELS = { sale:"販売", sample:"サンプル", demo:"デモ貸出", repair_sub:"修理代替品" };
let rowCount = 0;
let currentSearchRow = null;
let searchTimer = null;

function updateReturnDue() {
  const rows = document.querySelectorAll('#items_body tr.item-row');
  const hasDemoOrRepair = [...rows].some(r => {
    const t = r.dataset.type;
    return t === 'demo' || t === 'repair_sub';
  });
  document.getElementById('return_due_wrap').style.display = hasDemoOrRepair ? '' : 'none';
}

function addRow(type) {
  document.getElementById('empty_row').style.display = 'none';
  const id = ++rowCount;
  const tr = document.createElement('tr');
  tr.className = 'item-row';
  tr.id = `row_${id}`;
  tr.dataset.type = type;
  tr.dataset.productId = '';
  tr.dataset.serialNumber = '';
  tr.dataset.lotNumber = '';
  tr.dataset.expiryDate = '';
  tr.dataset.demoUnitId = '';

  const isDemoType = (type === 'demo' || type === 'repair_sub');

  tr.innerHTML = `
    <td><span class="type-badge type-${type}">${TYPE_LABELS[type]}</span></td>
    <td>
      <input type="text" class="item-input" id="search_${id}"
             placeholder="${isDemoType ? 'デモ器名・管理番号・S.N' : '商品名・S.N・ロット番号'}"
             oninput="onSearchInput(${id}, '${type}')"
             onfocus="onSearchInput(${id}, '${type}')"
             autocomplete="off">
      <div id="selected_${id}" style="font-size:0.78rem;color:#5f6b7a;margin-top:3px;display:none"></div>
    </td>
    <td><input type="number" class="item-input" id="qty_${id}" value="1" min="1" style="width:60px;text-align:center"></td>
    <td>${isDemoType ? '―' : `<input type="date" class="item-input" id="expiry_${id}" style="font-size:0.78rem">`}</td>
    <td><button type="button" onclick="removeRow(${id})" style="background:none;border:none;color:#e53935;cursor:pointer;font-size:1rem">×</button></td>
  `;
  document.getElementById('items_body').appendChild(tr);
  updateReturnDue();
  document.getElementById(`search_${id}`).focus();
}

function removeRow(id) {
  const row = document.getElementById(`row_${id}`);
  if (row) row.remove();
  if (!document.querySelectorAll('#items_body tr.item-row').length) {
    document.getElementById('empty_row').style.display = '';
  }
  updateReturnDue();
}

function onSearchInput(id, type) {
  clearTimeout(searchTimer);
  const q = document.getElementById(`search_${id}`).value.trim();
  currentSearchRow = id;
  searchTimer = setTimeout(() => {
    const isDemoType = (type === 'demo' || type === 'repair_sub');
    const url = isDemoType
      ? `/api/demo-units?q=${encodeURIComponent(q)}`
      : `/api/inventory-items?q=${encodeURIComponent(q)}`;
    fetch(url).then(r => r.json()).then(items => showDropdown(id, type, items));
  }, 250);
}

function showDropdown(id, type, items) {
  const input = document.getElementById(`search_${id}`);
  const rect = input.getBoundingClientRect();
  const dd = document.getElementById('search_dropdown');
  dd.style.display = 'block';
  dd.style.left = (window.scrollX + rect.left) + 'px';
  dd.style.top  = (window.scrollY + rect.bottom + 2) + 'px';
  dd.style.width = Math.max(360, rect.width) + 'px';

  const isDemoType = (type === 'demo' || type === 'repair_sub');

  if (!items.length) {
    dd.innerHTML = '<div style="padding:12px 16px;color:#9ca3af;font-size:0.85rem">候補が見つかりません</div>';
    return;
  }
  dd.innerHTML = items.map(it => {
    let main, sub;
    if (isDemoType) {
      main = `<strong>${it.product_name}</strong> <span style="color:#7c3aed;font-size:0.78rem">【${it.status_label}】</span>`;
      sub  = `管理番号：${it.unit_code}　S.N：${it.serial_number||'―'}　ロット：${it.lot_number||'―'}`;
    } else {
      main = `<strong>${it.product_name}</strong>`;
      sub  = `S.N：${it.serial_number||'―'}　ロット：${it.lot_number||'―'}　入庫日：${it.moved_at||'―'}`;
    }
    const data = encodeURIComponent(JSON.stringify(it));
    return `<div style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #f0f4f8"
                 onmousedown="selectItem(${id},'${type}',${JSON.stringify(it).replace(/"/g,'&quot;')})"
                 onmouseover="this.style.background='#f0f4f8'" onmouseout="this.style.background=''">
              <div style="font-size:0.85rem">${main}</div>
              <div style="font-size:0.75rem;color:#5f6b7a">${sub}</div>
            </div>`;
  }).join('');
}

function selectItem(id, type, it) {
  const isDemoType = (type === 'demo' || type === 'repair_sub');
  const row = document.getElementById(`row_${id}`);
  if (isDemoType) {
    row.dataset.productId    = it.product_id;
    row.dataset.demoUnitId   = it.id;
    row.dataset.serialNumber = it.serial_number || '';
    row.dataset.lotNumber    = it.lot_number || '';
    document.getElementById(`search_${id}`).value = `${it.product_name} / ${it.unit_code}`;
    const disp = document.getElementById(`selected_${id}`);
    disp.innerHTML = `S.N：${it.serial_number||'―'}　ロット：${it.lot_number||'―'}　【${it.status_label}】`;
    disp.style.display = '';
  } else {
    row.dataset.productId    = it.product_id;
    row.dataset.serialNumber = it.serial_number || '';
    row.dataset.lotNumber    = it.lot_number || '';
    row.dataset.expiryDate   = it.expiry_date || '';
    document.getElementById(`search_${id}`).value = it.product_name + (it.serial_number ? ` / ${it.serial_number}` : it.lot_number ? ` / ロット:${it.lot_number}` : '');
    const disp = document.getElementById(`selected_${id}`);
    disp.innerHTML = `S.N：${it.serial_number||'―'}　ロット：${it.lot_number||'―'}`;
    disp.style.display = '';
    const expEl = document.getElementById(`expiry_${id}`);
    if (expEl && it.expiry_date) expEl.value = it.expiry_date;
  }
  document.getElementById('search_dropdown').style.display = 'none';
}

document.addEventListener('click', e => {
  if (!e.target.closest('#search_dropdown') && !e.target.closest('.item-input')) {
    document.getElementById('search_dropdown').style.display = 'none';
  }
});

function prepareSubmit() {
  if (!document.getElementById('customer_id').value) {
    alert('取引先を選択してください。');
    document.getElementById('customer_id_text').focus();
    return false;
  }
  const rows = [...document.querySelectorAll('#items_body tr.item-row')];
  if (!rows.length) { alert('明細を1行以上追加してください。'); return false; }
  const items = rows.map(row => {
    const id = row.id.replace('row_', '');
    const expiryEl = document.getElementById(`expiry_${id}`);
    return {
      shipment_type: row.dataset.type,
      product_id:    row.dataset.productId ? parseInt(row.dataset.productId) : null,
      quantity:      parseInt(document.getElementById(`qty_${id}`)?.value || 1),
      serial_number: row.dataset.serialNumber || '',
      lot_number:    row.dataset.lotNumber || '',
      expiry_date:   expiryEl ? expiryEl.value : '',
      demo_unit_id:  row.dataset.demoUnitId ? parseInt(row.dataset.demoUnitId) : null,
    };
  });
  const missing = items.findIndex(it => !it.product_id);
  if (missing >= 0) { alert(`${missing+1}行目の商品が選択されていません。`); return false; }
  document.getElementById('items_json').value = JSON.stringify(items);
  return true;
}
</script>
{% endblock %}
