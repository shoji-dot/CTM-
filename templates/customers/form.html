{% extends "base.html" %}
{% block title %}{{ "顧客編集" if customer else "顧客登録" }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">{{ "顧客編集" if customer else "顧客登録" }}</h1>
  <a href="/customers" class="btn btn-ghost">← 一覧に戻る</a>
</div>
<div class="form-card">
  <form method="post" action="{{ '/customers/' + customer.id|string + '/edit' if customer else '/customers/new' }}">
    <div class="form-grid">
      <div class="form-group span-2">
        <label class="label">顧客名 <span class="required">*</span></label>
        <input name="name" value="{{ customer.name if customer else '' }}" required class="input">
      </div>
      <div class="form-group">
        <label class="label">カテゴリ</label>
        <select name="category" class="select">
          <option value="hospital" {{ "selected" if not customer or customer.category in ("hospital", "medical") }}>医療機関</option>
          <option value="supplier" {{ "selected" if customer and customer.category in ("supplier", "ham") }}>取引先</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">電話番号</label>
        <input name="phone" value="{{ customer.phone if customer else '' }}" class="input">
      </div>
      <div class="form-group">
        <label class="label">メールアドレス</label>
        <input name="email" type="email" value="{{ customer.email if customer else '' }}" class="input">
      </div>
      <div class="form-group span-2">
        <label class="label">住所</label>
        <input name="address" value="{{ customer.address if customer else '' }}" class="input">
      </div>
      <div class="form-group span-2">
        <label class="label">取引条件</label>
        <textarea name="trading_terms" class="textarea" rows="2" placeholder="例：月末締め翌月末払い">{{ customer.trading_terms if customer else '' }}</textarea>
      </div>
      <div class="form-group span-2">
        <label class="label">備考</label>
        <textarea name="notes" class="textarea" rows="3">{{ customer.notes if customer else '' }}</textarea>
      </div>
      <div class="form-group">
        <label class="label">担当営業</label>
        <select name="staff_id" class="select">
          <option value="">-- 未設定 --</option>
          {% for staff in staffs %}
            <option value="{{ staff.id }}"
              {% if customer and customer.staff_id == staff.id %}selected{% endif %}>
              {{ staff.name }}{% if staff.department %}（{{ staff.department }}）{% endif %}
            </option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-actions">
      <a href="/customers" class="btn btn-ghost">キャンセル</a>
      <button type="submit" class="btn btn-primary">{{ "更新する" if customer else "登録する" }}</button>
    </div>
  </form>
</div>
{% endblock %}
