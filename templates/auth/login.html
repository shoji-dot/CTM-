<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - SalesCore</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0">
  <div class="login-card">
    <div class="login-logo">
      <span style="font-size:36px">⚕</span>
      <div class="logo-title" style="font-size:20px;margin-top:8px">SalesCore</div>
      <div class="logo-sub">営業・在庫管理システム</div>
    </div>
    {% if error %}
    <div class="alert-banner" style="margin-bottom:16px">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="form-group" style="margin-bottom:14px">
        <label class="label">ログインID</label>
        <input name="login_id" class="input" required autofocus placeholder="ログインIDを入力">
      </div>
      <div class="form-group" style="margin-bottom:20px">
        <label class="label">パスワード</label>
        <input name="password" type="password" class="input" required placeholder="パスワードを入力">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px">ログイン</button>
    </form>
  </div>
</body>
</html>
