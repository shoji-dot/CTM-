{% extends "base.html" %}
{% block title %}修理受付 新規登録{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">修理受付 新規登録</h1>
  <a href="/repairs/" class="btn btn-ghost">← 一覧に戻る</a>
</div>
<div class="form-card">
  <form method="post" action="/repairs/new">
    <div class="form-section">
      <h2 class="form-section-title">受付情報</h2>
      <div class="form-row">
        <div class="form-group">
          <label class="label">受付日 <span class="required">*</span></label>
          <input type="date" name="received_date" value="{{ today }}" class="input" required>
        </div>
        <div class="form-group">
          <label class="label">顧客 <span class="required">*</span></label>
          <div class="cac-wrap" style="position:relative">
            <input type="text" id="customer_id_text" class="input" placeholder="顧客名で検索..."
                   autocomplete="off"
                   oninput="customerAC(this,'customer_id','customer_id_dd')"
                   onfocus="if(this.value.trim())customerAC(this,'customer_id','customer_id_dd')">
            <input type="hidden" name="customer_id" id="customer_id" value="">
            <div id="customer_id_dd" class="cac-dd" style="display:none;position:absolute;z-index:9999;background:white;border:1px solid #dde3ea;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);width:100%;max-height:240px;overflow-y:auto"></div>
          </div>
        </div>
        <div class="form-group">
          <label class="label">エンドユーザー</label>
          <div class="cac-wrap" style="position:relative">
            <input type="text" id="end_user_id_text" class="input" placeholder="エンドユーザー名で検索（任意）"
                   autocomplete="off"
                   oninput="customerAC(this,'end_user_id','end_user_id_dd')"
                   onfocus="if(this.value.trim())customerAC(this,'end_user_id','end_user_id_dd')">
            <input type="hidden" name="end_user_id" id="end_user_id" value="">
            <div id="end_user_id_dd" class="cac-dd" style="display:none;position:absolute;z-index:9999;background:white;border:1px solid #dde3ea;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);width:100%;max-height:240px;overflow-y:auto"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h2 class="form-section-title">故障品情報</h2>
      <div class="form-row">
        <div class="form-group">
          <label class="label">商品 <span class="required">*</span></label>
          <select name="product_id" class="select" required>
            <option value="">選択してください</option>
            {% for p in products %}
            <option value="{{ p.id }}">{{ p.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="label">シリアル番号</label>
          <input type="text" name="serial_number" class="input" placeholder="例: SN-12345">
        </div>
        <div class="form-group">
          <label class="label">ロット番号</label>
          <input type="text" name="lot_number" class="input" placeholder="例: LOT-2024">
        </div>
      </div>
      <div class="form-group">
        <label class="label">故障内容 <span class="required">*</span></label>
        <textarea name="fault_description" class="textarea" rows="3" placeholder="故障・不具合の詳細を入力してください" required></textarea>
      </div>
    </div>

    <div class="form-section">
      <h2 class="form-section-title">修理代替品（出荷済みの修理代替品と紐づける場合）</h2>
      <div class="form-group">
        <label class="label">修理代替品出荷</label>
        <select name="replacement_shipment_id" class="select">
          <option value="">（紐づけなし）</option>
          {% for s in rep_shipments %}
          <option value="{{ s.id }}">{{ s.shipment_number }} — {{ s.product_name }} / {{ s.customer_name }}{% if s.serial_number %} / {{ s.serial_number }}{% endif %}</option>
          {% endfor %}
        </select>
        <p class="form-hint">種別「修理代替品」かつ出荷中の出荷が表示されます</p>
      </div>
    </div>

    <div class="form-section">
      <div class="form-group">
        <label class="label">備考</label>
        <textarea name="notes" class="textarea" rows="2"></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" onclick="return checkRepairCustomer()">受付登録</button>
      <a href="/repairs/" class="btn btn-ghost">キャンセル</a>
    </div>
  </form>
<script>
function checkRepairCustomer() {
  if (!document.getElementById('customer_id').value) {
    alert('顧客を選択してください。');
    document.getElementById('customer_id_text').focus();
    return false;
  }
  return true;
}
</script>
</div>
{% endblock %}
